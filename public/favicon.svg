<!-- A phi in a rounded tile. Drawn as fills rather than strokes so a renderer
     that ignores stroke attributes still gets the mark right, and with the
     counter kept wide so the bowl does not close up at 16px. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="vphilox">
    <title>vphilox</title>
    <rect width="64" height="64" rx="13" fill="#16161a"/>
    <path fill="#fbfbf9" fill-rule="evenodd"
          d="M14 32a18 15.5 0 1 0 36 0a18 15.5 0 1 0 -36 0ZM20.5 32a11.5 9 0 1 0 23 0a11.5 9 0 1 0 -23 0Z"/>
    <rect x="28.75" y="8.5" width="6.5" height="47" rx="3.25" fill="#fbfbf9"/>
</svg>

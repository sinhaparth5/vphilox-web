name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that is mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The committed MDX must match what the .tex and the filter produce.
      - name: Check the paper is up to date
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          ./scripts/convert-paper.sh
          git diff --exit-code -- src/content/paper/vphilox.mdx \
            || { echo "::error::src/content/paper/vphilox.mdx is stale — run ./scripts/convert-paper.sh and commit"; exit 1; }

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
